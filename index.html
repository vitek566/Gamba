<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CloverPit: The Slot Machine Debt</title>
    <style>
        :root {
            --bg-color: #09090e;
            --panel-color: #12121f;
            --neon-cyan: #00f2fe;
            --neon-red: #ff2a5f;
            --neon-green: #39ff14;
            --text-gold: #ffd700;
        }

        body { 
            background-color: var(--bg-color); 
            color: #fff; 
            font-family: 'Courier New', Courier, monospace; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center; 
            min-height: 100vh; 
            margin: 0; 
            padding: 15px;
            overflow-x: hidden;
        }

        /* Atmosférický CRT šum/překrytí */
        body::before {
            content: " ";
            display: block;
            position: fixed;
            top: 0; left: 0; bottom: 0; right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
            z-index: 999;
            background-size: 100% 4px, 6px 100%;
            pointer-events: none;
        }

        .game-wrapper { 
            background: var(--panel-color); 
            padding: 30px; 
            border-radius: 20px; 
            box-shadow: 0 0 30px rgba(0, 0, 0, 0.8), inset 0 0 15px rgba(0, 242, 254, 0.1); 
            width: 100%; 
            max-width: 700px; 
            text-align: center; 
            border: 2px solid #1f1f35;
            position: relative;
        }

        h1 { 
            font-size: 2.2rem; 
            text-transform: uppercase; 
            letter-spacing: 3px; 
            color: #fff; 
            text-shadow: 0 0 10px var(--neon-red); 
            margin-top: 0; 
            margin-bottom: 5px;
        }

        .subtitle {
            font-size: 0.8rem;
            color: #666;
            text-transform: uppercase;
            margin-bottom: 20px;
            letter-spacing: 1px;
        }

        /* Monitor splátek */
        .terminal-monitor {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            background: #050508;
            padding: 15px;
            border-radius: 10px;
            border: 1px solid #2a2a44;
            margin-bottom: 20px;
        }

        .monitor-box {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 10px;
            background: rgba(255,255,255,0.02);
            border-radius: 6px;
        }

        .monitor-label { font-size: 0.75rem; color: #888; text-transform: uppercase; margin-bottom: 5px;}
        .monitor-val { font-size: 1.6rem; font-weight: bold; }
        
        .color-red { color: var(--neon-red); text-shadow: 0 0 8px var(--neon-red); }
        .color-yellow { color: var(--text-gold); text-shadow: 0 0 8px var(--text-gold); }
        .color-green { color: var(--neon-green); text-shadow: 0 0 8px var(--neon-green); }
        .color-cyan { color: var(--neon-cyan); text-shadow: 0 0 8px var(--neon-cyan); }

        /* Hlavní statistiky hráče */
        .player-stats {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-bottom: 25px;
        }

        .stat-card {
            background: #0a0a12;
            padding: 12px;
            border-radius: 8px;
            border-left: 4px solid var(--neon-cyan);
            text-align: left;
        }
        .stat-card.min-bet-card { border-left-color: #8a2be2; }

        .stat-title { font-size: 0.7rem; color: #555; text-transform: uppercase; }
        .stat-number { font-size: 1.3rem; font-weight: bold; margin-top: 3px; }

        /* Válce Automatu (CloverPit mřížka) */
        .slot-machine-grid {
            background: #000;
            border: 3px solid var(--neon-cyan);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 0 20px rgba(0, 242, 254, 0.2);
        }

        .reels-container {
            display: flex;
            justify-content: center;
            gap: 12px;
            min-height: 90px;
        }

        .reel-box {
            width: 75px;
            height: 90px;
            background: linear-gradient(180deg, #151522 0%, #08080f 100%);
            border: 2px solid #333;
            border-radius: 8px;
            font-size: 3.2rem;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.1s ease, filter 0.1s ease;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.8);
            user-select: none;
        }

        .blur-effect {
            filter: blur(4px) min-contrast(1.2);
            transform: scaleY(1.1);
            border-color: var(--neon-green);
        }

        /* Sekce sázky */
        .betting-area {
            background: #0a0a12;
            padding: 15px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
            margin-bottom: 20px;
            border: 1px solid #1f1f35;
        }

        .betting-area label { font-size: 0.9rem; text-transform: uppercase; color: #aaa; }
        .betting-area input {
            background: #000;
            color: var(--text-gold);
            border: 1px solid var(--neon-cyan);
            padding: 10px;
            border-radius: 6px;
            width: 130px;
            text-align: center;
            font-size: 1.3rem;
            font-family: monospace;
            font-weight: bold;
        }
        .betting-area input:focus { outline: none; box-shadow: 0 0 10px var(--neon-cyan); }

        .game-status {
            height: 30px;
            font-weight: bold;
            font-size: 1rem;
            margin-bottom: 15px;
            color: #888;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .text-gold { color: var(--text-gold); text-shadow: 0 0 10px rgba(255,215,0,0.5); }
        .text-pulse { animation: statusPulse 1s infinite alternate; }

        @keyframes statusPulse {
            0% { transform: scale(1); }
            100% { transform: scale(1.03); }
        }

        /* Velké odpalovací tlačítko */
        #spinBtn {
            width: 100%;
            background: linear-gradient(135deg, #ff2a5f 0%, #990026 100%);
            color: #fff;
            padding: 16px;
            border: none;
            border-radius: 10px;
            font-size: 1.6rem;
            font-family: monospace;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 2px;
            cursor: pointer;
            box-shadow: 0 6px 0 #66001a, 0 10px 20px rgba(0,0,0,0.5);
            transition: all 0.1s ease;
            margin-bottom: 25px;
        }
        #spinBtn:hover:not(:disabled) {
            background: linear-gradient(135deg, #ff557f 0%, #b3002d 100%);
        }
        #spinBtn:active:not(:disabled) {
            transform: translateY(4px);
            box-shadow: 0 2px 0 #66001a, 0 4px 10px rgba(0,0,0,0.5);
        }
        #spinBtn:disabled {
            opacity: 0.3;
            cursor: not-allowed;
            box-shadow: none;
            transform: translateY(4px);
        }

        /* Obchod s vylepšeními */
        .shop-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .buff-card {
            background: #11111f;
            border: 1px solid #252542;
            padding: 12px;
            border-radius: 8px;
            text-align: left;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            transition: all 0.2s ease;
        }
        .buff-card:hover:not(:disabled) {
            border-color: var(--neon-cyan);
            background: #16162d;
            box-shadow: 0 0 10px rgba(0, 242, 254, 0.1);
        }
        .buff-card:disabled {
            opacity: 0.25;
            cursor: not-allowed;
        }

        .buff-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 5px;
        }
        .buff-name { font-weight: bold; font-size: 0.85rem; color: #fff; }
        .buff-cost { color: var(--text-gold); font-weight: bold; font-size: 0.85rem; }
        .buff-desc { font-size: 0.7rem; color: #777; line-height: 1.2; }

        /* Celoobrazovkový Jackpot Glitch Efekt */
        .jackpot-fullscreen {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(0, 0, 0, 0.95);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 99999;
            animation: glitchFlash 0.1s infinite alternate;
        }
        .jackpot-title {
            font-size: 5rem;
            font-weight: 900;
            color: var(--text-gold);
            text-shadow: 0 0 20px #fff, 3px 3px 0 #ff0055, -3px -3px 0 #00ffff;
            letter-spacing: 5px;
            animation: extremeShake 0.05s infinite;
        }
        .jackpot-sub {
            font-size: 2.5rem;
            color: var(--neon-green);
            text-shadow: 0 0 10px var(--neon-green);
            font-weight: bold;
            margin-top: 20px;
        }
        .hidden { display: none !important; }

        @keyframes glitchFlash {
            0% { background-color: rgba(20, 0, 40, 0.95); }
            100% { background-color: rgba(0, 30, 20, 0.95); }
        }
        @keyframes extremeShake {
            0% { transform: translate(3px, 1px) rotate(0deg); }
            50% { transform: translate(-2px, -3px) rotate(-2deg); }
            100% { transform: translate(1px, 3px) rotate(1deg); }
        }
    </style>
</head>
<body>

<div id="jackpotOverlay" class="jackpot-fullscreen hidden">
    <div class="jackpot-title">⚡ JACKPOT ⚡</div>
    <div id="jackpotPrize" class="jackpot-sub">+0 Kč</div>
</div>

<div class="game-wrapper">
    <h1>CloverPit: Slots Debt</h1>
    <div class="subtitle">Úniková Hra s Prohnaným Automatem</div>
    
    <div class="terminal-monitor">
        <div class="monitor-box">
            <span class="monitor-label">Čas do Expirace</span>
            <span id="timerDisplay" class="monitor-val color-red">05:00</span>
        </div>
        <div class="monitor-box">
            <span class="monitor-label">Požadovaný Dluh</span>
            <span id="debtDisplay" class="monitor-val color-yellow">1500 Kč</span>
        </div>
    </div>
    
    <div class="player-stats">
        <div class="stat-card">
            <span class="stat-title">Tvůj Kredit (ATM)</span>
            <div id="balanceDisplay" class="stat-number color-green">5000 Kč</div>
        </div>
        <div class="stat-card min-bet-card">
            <span class="stat-title">Minimální Sázka (+1%/spin)</span>
            <div id="minBetDisplay" class="stat-number color-cyan">100 Kč</div>
        </div>
    </div>

    <div class="slot-machine-grid">
        <div id="reelsContainer" class="reels-container">
            </div>
    </div>

    <div id="statusMessage" class="game-status">Zadej sázku a roztoč válce...</div>
    
    <div class="betting-area">
        <label for="betInput">Vsazená částka:</label>
        <input type="number" id="betInput" value="100">
        <span class="color-cyan" id="levelDisplay">LEVEL: 1</span>
    </div>

    <button id="spinBtn">Zatáhnout za páku</button>

    <div class="shop-grid">
        <button class="buff-card" id="btnLuck" onclick="buyUpgrade('luck')">
            <div class="buff-header">
                <span class="buff-name">🍀 Zvýšit Štěstí</span>
                <span id="costLuck" class="buff-cost">400 Kč</span>
            </div>
            <div class="buff-desc" id="descLuck">Šance na Lucky Spin +2%. (Nyní: 20% / Max 30%)</div>
        </button>

        <button class="buff-card" id="btnSlot" onclick="buyUpgrade('slot')">
            <div class="buff-header">
                <span class="buff-name">🎰 Přidat Válec</span>
                <span id="costSlot" class="buff-cost">1000 Kč</span>
            </div>
            <div class="buff-desc" id="descSlot">Přidá +1 aktivní slot. (Max 6 slotů pro obří komba)</div>
        </button>

        <button class="buff-card" id="btnSymMult" onclick="buyUpgrade('symMult')">
            <div class="buff-header">
                <span class="buff-name">🔺 Multiplikátor Symbolů</span>
                <span id="costSymMult" class="buff-cost">600 Kč</span>
            </div>
            <div class="buff-desc" id="descSymMult">Zvyšuje základní hodnotu všech ikon na ploše. (Nyní: 1.0x)</div>
        </button>

        <button class="buff-card" id="btnPatMult" onclick="buyUpgrade('patMult')">
            <div class="buff-header">
                <span class="buff-name">💥 Multiplikátor Vzorů</span>
                <span id="costPatMult" class="buff-cost">800 Kč</span>
            </div>
            <div class="buff-desc" id="descPatMult">Zesiluje finanční bonus za shody 3 a více prvků. (Nyní: 1.0x)</div>
        </button>
    </div>
</div>

<script>
    // Nastavení konfigurace (CloverPit styl)
    const INITIAL_BALANCE = 5000;
    const INITIAL_MIN_BET = 100;
    const MIN_BET_GROWTH = 1.01; // Sázka roste o 1% s každým spinem
    const MAX_SLOTS = 6;
    const MAX_LUCK_UPGRADES = 5; // Z 20% na max 30% (+2% za krok)

    // Číselník symbolů, jejich základní hodnoty a váhy pravděpodobnosti
    const SYMBOLS = [
        { char: '🍒', baseValue: 5, weight: 45 },
        { char: '🍋', baseValue: 12, weight: 35 },
        { char: '🍊', baseValue: 25, weight: 25 },
        { char: '🍉', baseValue: 60, weight: 15 },
        { char: '🔔', baseValue: 150, weight: 8 },
        { char: '⭐', baseValue: 400, weight: 4 },
        { char: '💎', baseValue: 666, weight: 2 } // 666 je typické číslo pro CloverPit
    ];

    // Stav hry
    let state = {
        balance: INITIAL_BALANCE,
        minBet: INITIAL_MIN_BET,
        level: 1,
        slotsCount: 3,
        luckUpgrades: 0,
        symbolMultiplier: 1.0,
        patternMultiplier: 1.0,
        debt: 1500,
        timeRemaining: 300, // 5 minut na startu
        prices: { luck: 400, slot: 1000, symMult: 600, patMult: 800 }
    };

    let timerInterval = null;
    let isSpinning = false;

    // UI Cache objekty
    const ui = {
        timer: document.getElementById('timerDisplay'),
        debt: document.getElementById('debtDisplay'),
        balance: document.getElementById('balanceDisplay'),
        minBet: document.getElementById('minBetDisplay'),
        level: document.getElementById('levelDisplay'),
        betInput: document.getElementById('betInput'),
        spinBtn: document.getElementById('spinBtn'),
        reelsContainer: document.getElementById('reelsContainer'),
        status: document.getElementById('statusMessage'),
        jackpotOverlay: document.getElementById('jackpotOverlay'),
        jackpotPrize: document.
