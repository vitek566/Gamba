<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VIP Slot Machine: Evolution - New Design</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="main-container">
    <h1>Slots Evolution</h1>
    
    <div class="stats">
        <div class="stat-box stat-balance">Kredit<br><span id="balance" class="stat-val">10000</span> Kč</div>
        <div class="stat-box">Sázka<br><span id="betPrice" class="stat-val">500</span> Kč</div>
        <div class="stat-box stat-level">Level<br><span id="level" class="stat-val">1</span></div>
    </div>

    <div class="slot-machine">
        <div class="reel-container" id="reelContainer">
            </div>
    </div>

    <div id="gameStatus" class="game-status">Vítejte, zkusíte štěstí?</div>
    <button id="spinBtn">Zatočit</button>

    <div class="buffs">
        <button class="buff-btn" id="buffLuck" onclick="buyBuff('luck')">
            <span class="buff-title">Zvýšit Štěstí</span>
            <span class="buff-info">
                <span class="buff-price"><span id="p_luck">1000</span> Kč</span>
                <span class="buff-bonus">Šance +10%</span>
            </span>
        </button>
        <button class="buff-btn" id="buffSlots" onclick="buyBuff('slots')">
            <span class="buff-title">+1 Nový Slot</span>
            <span class="buff-info">
                <span class="buff-price"><span id="p_slots">2000</span> Kč</span>
                <span class="buff-bonus">Max 6 slotů</span>
            </span>
        </button>
        <button class="buff-btn" id="buffProfit" onclick="buyBuff('profit')">
            <span class="buff-title">Zvýšit Násobitel</span>
            <span class="buff-info">
                <span class="buff-price"><span id="p_profit">1500</span> Kč</span>
                <span class="buff-bonus">Zisk +1.0x</span>
            </span>
        </button>
    </div>
</div>

<script src="script.js"></script>
</body>
</html>
