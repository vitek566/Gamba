<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CloverPit: Balanced Edition</title>
    <style>
        /* ... (styly zůstávají stejné jako v předchozí verzi) ... */
        :root { --bg-color: #060609; --panel-color: #0d0d16; --neon-cyan: #00f2fe; --neon-red: #ff2a5f; --neon-green: #39ff14; --text-gold: #ffd700; --font-main: 'Courier New', Courier, monospace; }
        body { background-color: var(--bg-color); color: #fff; font-family: var(--font-main); display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; margin: 0; padding: 20px; overflow-x: hidden; user-select: none; }
        .game-wrapper { background: var(--panel-color); padding: 30px; border-radius: 12px; box-shadow: 0 20px 50px rgba(0, 0, 0, 0.9); width: 100%; max-width: 800px; border: 1px solid #1f1f35; }
        .dashboard { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-bottom: 20px; }
        .dash-box { background: #050508; border: 1px solid #2a2a44; border-radius: 8px; padding: 15px 10px; text-align: center; }
        .c-red { color: var(--neon-red); } .c-yellow { color: var(--text-gold); } .c-green { color: var(--neon-green); } .c-cyan { color: var(--neon-cyan); }
        .pay-debt-btn { background: #1a1a2e; border: 1px solid var(--text-gold); color: var(--text-gold); padding: 10px 30px; border-radius: 5px; cursor: pointer; font-weight: bold; }
        .pay-debt-btn:hover:not(:disabled) { background: var(--text-gold); color: #000; }
        .pay-debt-btn:disabled { opacity: 0.3; cursor: not-allowed; }
        .slot-machine { background: #000; border: 2px solid #333; padding: 25px; margin-bottom: 20px; border-radius: 10px; display: flex; justify-content: center; gap: 15px; }
        .reel { width: 80px; height: 100px; background: #111; border: 1px solid #222; font-size: 3.5rem; display: flex; align-items: center; justify-content: center; }
        .controls { display: flex; gap: 15px; margin-bottom: 25px; height: 70px; }
        .buy-btn { width: 35%; background: #0a0a12; border: 2px solid #1f1f35; color: var(--text-gold); cursor: pointer; }
        .spin-btn { flex-grow: 1; background: #990026; color: #fff; border: none; font-size: 1.8rem; font-weight: bold; cursor: pointer; }
        .shop { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        .upgrade-btn { background: #0c0c14; border: 1px solid #252542; padding: 10px; cursor: pointer; color: #fff; text-align: left; }
        .overlay { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0,0,0,0.95); display: flex; flex-direction: column; align-items: center; justify-content: center; opacity: 0; pointer-events: none; }
        .overlay.active { opacity: 1; pointer-events: all; }
    </style>
</head>
<body>

<div id="gameUI" class="game-wrapper">
    <div class="header"><h1>CloverPit</h1></div>
    <div class="dashboard">
        <div class="dash-box"><span style="font-size: 10px;">DLUH</span><br><span id="debtDisplay" class="c-yellow">0</span></div>
        <div class="dash-box"><span style="font-size: 10px;">ZŮSTATEK</span><br><span id="balanceDisplay" class="c-green">0</span></div>
        <div class="dash-box"><span style="font-size: 10px;">SPINY</span><br><span id="spinsDisplay" class="c-cyan">0</span></div>
        <div class="dash-box"><span style="font-size: 10px;">SYMB_LVL</span><br><span id="lvlDisplay" class="c-cyan">1</span></div>
    </div>
    
    <div style="text-align:center; margin-bottom: 20px;">
        <button id="payDebtBtn" class="pay-debt-btn" onclick="Game.payDebt()">SPLATIT DLUH</button>
    </div>

    <div class="slot-machine" id="reelsContainer"></div>

    <div class="controls">
        <button class="buy-btn" onclick="Game.buySpins()">KOUPIT 6 SPINŮ<br>(100 Kč)</button>
        <button id="spinBtn" class="spin-btn" onclick="Game.spin()">ZATÁHNOUT</button>
    </div>

    <div class="shop">
        <button class="upgrade-btn" id="btnLuck" onclick="Game.buyUpgrade('luck')">🍀 Štěstí (Lvl <span id="luckLvl">0</span>)<br><small>+12.5% šance na rare</small></button>
        <button class="upgrade-btn" id="btnSymMult" onclick="Game.buyUpgrade('symMult')">🔺 Upgrade Symbolů<br><small>+Level po příští splátce</small></button>
    </div>
</div>

<script>
const Game = (function() {
    const SYMBOLS = [
        { char: '🍋', base: 5, weight: 200 }, { char: '🍒', base: 10, weight: 180 }, { char: '🍀', base: 20, weight: 150 },
        { char: '💰', base: 40, weight: 100 }, { char: '7️⃣', base: 80, weight: 70 }, { char: '🔔', base: 150, weight: 40 },
        { char: '💎', base: 300, weight: 15 }
    ];
    
    let state = {
        debt: 1500,
        balance: 500,
        spins: 10,
        luckLv: 0,
        symLvl: 1,
        nextSymLvl: 1, // Čeká na splacení dluhu
        isSpinning: false
    };

    function updateUI() {
        document.getElementById('debtDisplay').textContent = state.debt;
        document.getElementById('balanceDisplay').textContent = state.balance;
        document.getElementById('spinsDisplay').textContent = state.spins;
        document.getElementById('luckLvl').textContent = state.luckLv;
        document.getElementById('lvlDisplay').textContent = state.symLvl;
        document.getElementById('payDebtBtn').disabled = (state.balance < state.debt);
    }

    return {
        init: () => {
            for(let i=0; i<3; i++) {
                const r = document.createElement('div'); r.className = 'reel'; r.textContent = '🎰';
                document.getElementById('reelsContainer').appendChild(r);
            }
            updateUI();
        },
        buySpins: () => {
            if(state.balance >= 100) { state.balance -= 100; state.spins += 6; updateUI(); }
        },
        buyUpgrade: (type) => {
            if(type === 'luck' && state.balance >= 300 && state.luckLv < 5) {
                state.balance -= 300; state.luckLv++; updateUI();
            } else if(type === 'symMult' && state.balance >= 600) {
                state.balance -= 600; state.nextSymLvl++; alert("Upgrade připraven. Aplikuje se po splacení dluhu.");
            }
        },
        spin: () => {
            if(state.spins <= 0) return;
            state.spins--;
            const reels = document.querySelectorAll('.reel');
            let totalWin = 0;
            
            reels.forEach(r => {
                // Snížená účinnost štěstí (poloviční vliv)
                let weightMod = state.luckLv * 12.5; 
                let rnd = Math.random() * (1000 + weightMod);
                let symbol = SYMBOLS[Math.floor(Math.random() * SYMBOLS.length)];
                r.textContent = symbol.char;
                totalWin += (symbol.base * state.symLvl);
            });
            
            state.balance += totalWin;
            updateUI();
        },
        payDebt: () => {
            if(state.balance >= state.debt) {
                state.balance -= state.debt;
                state.debt = Math.floor(state.debt * 2.5); // Rychlejší nárůst dluhu
                state.symLvl = state.nextSymLvl; // Zde se teprve aplikuje upgrade
                alert("Dluh splacen. Automat se upravuje...");
                updateUI();
            }
        }
    };
})();

Game.init();
</script>
</body>
</html>
