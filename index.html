<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VIP Casino Pro</title>
    <style>
        body { background-color: #1a1a2e; color: #fff; font-family: 'Segoe UI', sans-serif; display: flex; flex-direction: column; align-items: center; min-height: 100vh; margin: 0; padding: 20px; }
        .container { background-color: #16213e; padding: 25px; border-radius: 20px; box-shadow: 0 0 30px rgba(0,0,0,0.5); width: 100%; max-width: 600px; text-align: center; }
        .stats { display: flex; justify-content: space-around; background: #0f3460; padding: 15px; border-radius: 10px; margin-bottom: 20px; }
        .slots { display: flex; justify-content: center; gap: 15px; font-size: 3rem; background: #000; padding: 30px; border-radius: 15px; margin-bottom: 20px; border: 2px solid #e94560; }
        .reel { width: 60px; height: 60px; display: flex; align-items: center; justify-content: center; background: #fff; color: #000; border-radius: 8px; }
        .buffs { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; margin-top: 20px; }
        button { padding: 12px; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; transition: 0.3s; }
        #spinBtn { width: 100%; background-color: #e94560; color: white; font-size: 1.5rem; margin-bottom: 20px; }
        #spinBtn:hover { background-color: #ff5c77; }
        .buff-btn { background-color: #0f3460; color: #fff; font-size: 0.8rem; }
        .buff-btn:hover { background-color: #4dffff; color: #000; }
        .message { height: 30px; font-weight: bold; margin-bottom: 10px; color: #4dffff; }
    </style>
</head>
<body>

<div class="container">
    <h1>🎰 VIP SLOT MACHINE</h1>
    
    <div class="stats">
        <div>Kredit: <br><span id="balance">10000</span> Kč</div>
        <div>Sázka: <br><span id="betPrice">500</span> Kč</div>
        <div>Level: <br><span id="level">1</span></div>
    </div>

    <div class="slots" id="reelContainer">
        <div class="reel">🍒</div><div class="reel">🍒</div><div class="reel">🍒</div>
    </div>

    <div id="message" class="message">Hodně štěstí!</div>
    <button id="spinBtn">ZATOČIT</button>

    <div class="buffs">
        <button class="buff-btn" onclick="buyBuff('luck')">Štěstí<br><span id="p_luck">1000</span> Kč</button>
        <button class="buff-btn" onclick="buyBuff('slots')">Více slotů<br><span id="p_slots">2000</span> Kč</button>
        <button class="buff-btn" onclick="buyBuff('profit')">Zisk (+1)<br><span id="p_profit">1500</span> Kč</button>
    </div>
</div>

<script>
    let state = {
        balance: 10000,
        bet: 500,
        level: 1,
        slotsCount: 3,
        luck: 0,
        profitBonus: 0,
        prices: { luck: 1000, slots: 2000, profit: 1500 }
    };

    const symbols = ['🍒', '🍋', '🍊', '🍉', '⭐', '💎', '🔔'];

    function updateUI() {
        document.getElementById('balance').innerText = Math.floor(state.balance);
        document.getElementById('betPrice').innerText = Math.floor(state.bet);
        document.getElementById('level').innerText = state.level;
        for(let key in state.prices) {
            document.getElementById('p_'+key).innerText = Math.floor(state.prices[key]);
        }
    }

    function buyBuff(type) {
        if (state.balance >= state.prices[type]) {
            state.balance -= state.prices[type];
            state.prices[type] *= 1.5; // Zvýšení ceny buffu o 50%
            
            if(type === 'luck') state.luck += 5;
            if(type === 'slots') { 
                state.slotsCount++; 
                renderReels(); 
            }
            if(type === 'profit') state.profitBonus += 1;
            
            updateUI();
        } else {
            alert("Nedostatek kreditu!");
        }
    }

    function renderReels() {
        const container = document.getElementById('reelContainer');
        container.innerHTML = '';
        for(let i=0; i<state.slotsCount; i++) {
            container.innerHTML += '<div class="reel">🍒</div>';
        }
    }

    document.getElementById('spinBtn').onclick = () => {
        if (state.balance < state.bet) {
            alert("GAME OVER! Začínáš od začátku.");
            state = { balance: 10000, bet: 500, level: 1, slotsCount: 3, luck: 0, profitBonus: 0, prices: { luck: 1000, slots: 2000, profit: 1500 }};
            renderReels();
        } else {
            state.balance -= state.bet;
            state.bet *= 1.01; // Zdražení točky o 1%
            
            let results = [];
            for(let i=0; i<state.slotsCount; i++) {
                // Štěstí snižuje náhodu (posouvá výběr symbolů k těm "lepším")
                let randomIndex = Math.floor(Math.random() * (symbols.length - Math.min(state.luck / 10, 5)));
                results.push(symbols[randomIndex]);
            }
            
            const reels = document.querySelectorAll('.reel');
            results.forEach((s, i) => reels[i].innerText = s);

            // Vyhodnocení výhry
            let isWin = results.every(val => val === results[0]);
            if (isWin) {
                let win = state.bet * (3 + state.profitBonus);
                state.balance += win;
                document.getElementById('message').innerText = "VÝHRA: " + Math.floor(win) + " Kč!";
            } else {
                document.getElementById('message').innerText = "Zkus to znovu!";
            }
        }
        state.level = Math.floor(state.balance / 5000) + 1;
        updateUI();
    };

    updateUI();
</script>

</body>
</html>
</body>
</html>
