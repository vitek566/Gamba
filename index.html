<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CloverPit: Ultimate Edition (Zouchová Update)</title>
    <style>
        :root {
            --bg-color: #020205;
            --panel-color: #070710;
            --neon-cyan: #00f2fe;
            --neon-red: #ff2a5f;
            --neon-green: #39ff14;
            --neon-purple: #b92bff;
            --text-gold: #ffd700;
            --font-main: 'Courier New', Courier, monospace;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body { 
            background-color: var(--bg-color); 
            color: #fff; 
            font-family: var(--font-main); 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center; 
            min-height: 100vh; 
            padding: 15px;
            overflow-x: hidden;
            user-select: none;
        }

        body::before {
            content: " "; display: block; position: fixed; top: 0; left: 0; bottom: 0; right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
            z-index: 2; background-size: 100% 2px, 3px 100%; pointer-events: none;
        }

        h1 {
            color: var(--neon-cyan);
            text-transform: uppercase;
            text-shadow: 0 0 10px var(--neon-cyan), 0 0 20px var(--neon-cyan);
            margin-bottom: 20px;
            font-size: 2.5rem;
            text-align: center;
        }

        .stats-board {
            display: flex;
            gap: 20px;
            background: var(--panel-color);
            padding: 15px 30px;
            border: 2px solid var(--neon-purple);
            border-radius: 10px;
            box-shadow: 0 0 15px var(--neon-purple);
            margin-bottom: 20px;
            font-size: 1.2rem;
            flex-wrap: wrap;
            justify-content: center;
        }

        .stat { display: flex; flex-direction: column; align-items: center; }
        .stat-label { color: #888; font-size: 0.9rem; text-transform: uppercase; }
        .stat-value { font-weight: bold; color: var(--text-gold); text-shadow: 0 0 5px var(--text-gold); }
        .stat-value.debt { color: var(--neon-red); text-shadow: 0 0 5px var(--neon-red); }

        .slot-machine {
            display: flex;
            gap: 15px;
            background: #111;
            padding: 20px;
            border: 3px solid var(--neon-green);
            border-radius: 15px;
            box-shadow: 0 0 20px var(--neon-green), inset 0 0 20px #000;
            margin-bottom: 30px;
        }

        .reel {
            width: 80px;
            height: 120px;
            background: #000;
            border: 2px solid #333;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 4rem;
            overflow: hidden;
            position: relative;
            box-shadow: inset 0 0 10px rgba(255,255,255,0.1);
        }

        .controls {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 15px;
            width: 100%;
            max-width: 800px;
            margin-bottom: 20px;
        }

        button {
            background: #222;
            color: #fff;
            border: 2px solid;
            padding: 15px;
            font-family: inherit;
            font-size: 1rem;
            font-weight: bold;
            text-transform: uppercase;
            cursor: pointer;
            border-radius: 8px;
            transition: 0.3s;
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            filter: grayscale(1);
        }

        .btn-spin { border-color: var(--neon-cyan); color: var(--neon-cyan); box-shadow: 0 0 10px var(--neon-cyan); grid-column: 1 / -1; font-size: 1.5rem; }
        .btn-spin:hover:not(:disabled) { background: var(--neon-cyan); color: #000; }
        
        .btn-upgrade { border-color: var(--neon-purple); }
        .btn-upgrade:hover:not(:disabled) { background: var(--neon-purple); color: #fff; }
        
        .btn-debt { border-color: var(--neon-red); }
        .btn-debt:hover:not(:disabled) { background: var(--neon-red); color: #fff; }

        .campaign-info {
            text-align: center;
            margin-bottom: 20px;
            color: var(--neon-cyan);
            max-width: 600px;
        }

        /* Nové animace pro Zouchová Update */
        @keyframes reelBlur { 
            0% { transform: scaleY(1.1) translateY(-4px); filter: blur(3px); } 
            50% { transform: scaleY(1.1) translateY(4px); filter: blur(4px); } 
            100% { transform: scaleY(1.1) translateY(-4px); filter: blur(3px); } 
        }
        @keyframes jackpotPop { 
            0% { transform: translate(-50%, -50%) scale(0); opacity: 0; } 
            50% { transform: translate(-50%, -50%) scale(1.5); opacity: 1; filter: hue-rotate(90deg); } 
            100% { transform: translate(-50%, -50%) scale(2.5); opacity: 0; } 
        }

        .spinning { animation: reelBlur 0.1s infinite linear; }
        
        /* Modal Styly */
        #quizModal {
            display: none; 
            position: fixed; 
            top: 0; left: 0; 
            width: 100%; height: 100%; 
            background: rgba(0,0,0,0.98); 
            z-index: 200000; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center; 
            color: white; 
            padding: 20px; 
            text-align: center;
        }

        .modal-btn {
            background: transparent;
            border: 2px solid var(--neon-red);
            color: var(--neon-red);
            margin: 10px;
            padding: 10px 20px;
            font-size: 1.2rem;
        }

        .modal-btn:hover {
            background: var(--neon-red);
            color: white;
            box-shadow: 0 0 15px var(--neon-red);
        }

        #bossImage {
            max-width: 300px;
            border: 3px solid var(--neon-red);
            box-shadow: 0 0 30px var(--neon-red);
            border-radius: 10px;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>

    <h1>CloverPit: Ultimate Edition</h1>
    
    <div class="campaign-info" id="campaignDesc">
        Vyber kampaň pro začátek hry.
    </div>

    <div class="stats-board">
        <div class="stat"><span class="stat-label">Level</span><span class="stat-value" id="uiLevel">0</span></div>
        <div class="stat"><span class="stat-label">Zůstatek</span><span class="stat-value" id="uiBalance">1,000 Kč</span></div>
        <div class="stat"><span class="stat-label">Dluh (cíl)</span><span class="stat-value debt" id="uiDebt">0 Kč</span></div>
        <div class="stat"><span class="stat-label">Spiny</span><span class="stat-value" id="uiSpins">0</span></div>
        <div class="stat"><span class="stat-label">Výherní Násobič</span><span class="stat-value" id="uiMult">1x</span></div>
    </div>

    <div class="slot-machine" id="slotsContainer">
        </div>

    <div class="controls">
        <button class="btn-spin" id="btnSpin" onclick="Game.spin()">ZATOČIT (1 Spin)</button>
        <button class="btn-upgrade" id="btnLuck" onclick="Game.buyUpgrade('luck')">Štěstí (Cena: <span id="costLuck">100</span> Kč)</button>
        <button class="btn-upgrade" id="btnSlot" onclick="Game.buyUpgrade('slot')">Nový Slot (Cena: <span id="costSlot">500</span> Kč)</button>
        <button class="btn-upgrade" id="btnPatMult" onclick="Game.buyUpgrade('patMult')">Násobič (Cena: <span id="costPatMult">200</span> Kč)</button>
        <button class="btn-debt" id="btnPayDebt" onclick="Game.payDebt()">Zaplatit Dluh</button>
        <button class="btn-upgrade" id="btnStartZouchova" onclick="Game.startCampaign(5)">START: Kampaň Literatura</button>
    </div>

    <div id="quizModal">
        <img src="Zouchova-Jana.jpg" id="bossImage" alt="Zouchová">
        <h2 style="color: var(--neon-red); text-shadow: 0 0 10px var(--neon-red); margin-bottom: 10px;">LITERÁRNÍ BOSS FIGHT</h2>
        <p id="quizQuestion" style="font-size: 1.5rem; margin-bottom: 20px;">Připrav se na zkoušení z literatury!</p>
        <div id="quizAnswers" style="display: flex; flex-direction: column; width: 100%; max-width: 400px;">
            </div>
    </div>

<script>
// --- SYMBOLY A JEJICH HODNOTY ---
const SYMBOLS = [
    { char: '🍒', weight: 50, value: 10 },
    { char: '🍋', weight: 40, value: 20 },
    { char: '🍇', weight: 30, value: 30 },
    { char: '🔔', weight: 20, value: 50 },
    { char: '💎', weight: 10, value: 100 },
    { char: '🍀', weight: 5,  value: 500 }
];

// --- ZOUCHOVÁ KVÍZ LOGIKA ---
const ZouchovaQuiz = {
    questions: [
        { q: "Kdo napsal Babičku?", a: ["Božena Němcová", "Karolína Světlá", "Eliška Krásnohorská", "Marie Pujmanová"], correct: 0 },
        { q: "Kdo je autorem Máchova Máje?", a: ["Karel Jaromír Erben", "Karel Havlíček Borovský", "Karel Hynek Mácha", "Jan Neruda"], correct: 2 },
        { q: "Jaké dílo napsal Karel Jaromír Erben?", a: ["Babička", "Kytice", "Povídky malostranské", "Máj"], correct: 1 },
        { q: "Kdo napsal hru R.U.R., kde poprvé zaznělo slovo 'robot'?", a: ["Josef Čapek", "Karel Čapek", "Karel Poláček", "Vladislav Vančura"], correct: 1 },
        { q: "Kdo je autorem Osudů dobrého vojáka Švejka?", a: ["Bohumil Hrabal", "Milan Kundera", "Jaroslav Hašek", "Karel Čapek"], correct: 2 }
    ],
    currentQ: 0,
    start: function() {
        this.currentQ = 0;
        // Náhodně zamícháme otázky pro každou hru
        this.questions.sort(() => Math.random() - 0.5);
        document.getElementById('quizModal').style.display = 'flex';
        this.loadQuestion();
    },
    loadQuestion: function() {
        if (this.currentQ >= 3) { // 3 správné odpovědi k poražení bosse
            this.win();
            return;
        }
        let q = this.questions[this.currentQ];
        document.getElementById('quizQuestion').textContent = `Otázka ${this.currentQ + 1}/3: ${q.q}`;
        let container = document.getElementById('quizAnswers');
        container.innerHTML = '';
        
        q.a.forEach((opt, idx) => {
            let btn = document.createElement('button');
            btn.className = 'modal-btn'; 
            btn.textContent = opt;
            btn.onclick = () => {
                if (idx === q.correct) { 
                    this.currentQ++;
                    this.loadQuestion();
                } else { 
                    alert("Zouchová tě vyhodila! Špatná odpověď. GAME OVER."); 
                    location.reload(); 
                }
            };
            container.appendChild(btn);
        });
    },
    win: function() {
        document.getElementById('quizModal').style.display = 'none';
        alert("ÚSPĚCH! Zouchová ti dala za 1! Vyhrál jsi kampaň Literatura!");
        Game.state.balance += 1000000; // Odměna za poražení bosse
        Game.updateUI();
    }
};

// --- GENERÁTOR SMĚN (Rozšířený o kampaň 5) ---
const ShiftGenerator = {
    getOriginalShift: function(idx) {
        // Základní progrese pro generování dluhu a spinů
        const baseDebt = 500 * Math.pow(1.5, idx);
        return { debt: baseDebt, mult: 1 + (idx * 0.1) };
    },
    generate: function(diff, idx) {
        if (diff === 5) {
            // ZOUCHOVÁ UPDATE: Level 31 je boss fight
            if (idx === 30) {
                return {
                    lvl: 31, debt: 1000000, spins: 1, mult: 1,
                    mod: 'boss_fight', desc: `⚔️ BOSS FIGHT: Jana Zouchová! Zaplať 1,000,000 Kč nebo jdi na zkoušení!`
                };
            }
            if (idx > 30) return null; // Konec kampaně po bossovi

            let s = this.getOriginalShift(idx % 30);
            return {
                lvl: idx + 1, 
                debt: Math.floor(s.debt * 4.5), 
                spins: 15, 
                mult: s.mult * 3.5,
                mod: 'debuff_luck', 
                desc: `📖 KAMPANĚ LITERATURA: Zouchová sleduje tvůj pokrok. (Snížené štěstí!)`
            };
        }
        // Základní nekonečný režim jako fallback
        let s = this.getOriginalShift(idx);
        return {
            lvl: idx + 1, debt: Math.floor(s.debt), spins: 20, mult: s.mult, mod: 'none', desc: `Běžná směna.`
        };
    }
};

// --- HLAVNÍ LOGIKA HRY ---
const Game = {
    state: {
        balance: 1000,
        debt: 0,
        spins: 0,
        mult: 1,
        level: 0,
        slotsCount: 3,
        luckLv: 1,
        patMult: 1,
        isSpinning: false,
        difficulty: 5,
        currentShift: null,
        prices: { luck: 100, slot: 500, patMult: 200 }
    },

    init: function() {
        this.renderSlots();
        this.updateUI();
    },

    startCampaign: function(diff) {
        this.state.difficulty = diff;
        this.state.level = 0;
        this.state.balance = 1000;
        this.state.slotsCount = 3;
        this.state.luckLv = 1;
        this.state.patMult = 1;
        this.nextShift();
        document.getElementById('btnStartZouchova').style.display = 'none';
        this.renderSlots();
    },

    nextShift: function() {
        let shift = ShiftGenerator.generate(this.state.difficulty, this.state.level);
        if (!shift) {
            alert("Gratuluji! Dohrál jsi celou kampaň!");
            return;
        }

        if (shift.mod === 'boss_fight') {
            ZouchovaQuiz.start();
        }

        this.state.currentShift = shift;
        this.state.level = shift.lvl;
        this.state.debt = shift.debt;
        this.state.spins += shift.spins;
        this.state.mult = shift.mult;
        
        document.getElementById('campaignDesc').textContent = shift.desc;
        this.updateUI();
    },

    renderSlots: function() {
        const container = document.getElementById('slotsContainer');
        container.innerHTML = '';
        for (let i = 0; i < this.state.slotsCount; i++) {
            let reel = document.createElement('div');
            reel.className = 'reel';
            reel.id = `reel-${i}`;
            reel.textContent = '🎰';
            container.appendChild(reel);
        }
    },

    getRandomSymbol: function() {
        // Aplikace štěstí (Luck)
        let totalWeight = SYMBOLS.reduce((acc, s) => acc + s.weight, 0);
        let random = Math.random() * totalWeight;
        
        // Pokud má hráč vyšší luckLv, dáváme bonus k šanci na vzácnější symboly
        if (this.state.luckLv > 1 && Math.random() < (this.state.luckLv * 0.05)) {
            return SYMBOLS[SYMBOLS.length - 1].char; // Garantovaný lepší symbol
        }

        for (let s of SYMBOLS) {
            if (random < s.weight) return s.char;
            random -= s.weight;
        }
        return SYMBOLS[0].char;
    },

    spin: function() {
        if (this.state.spins <= 0 || this.state.isSpinning) return;
        
        this.state.isSpinning = true;
        this.state.spins--;
        this.updateUI();

        const reels = document.querySelectorAll('.reel');
        reels.forEach(r => r.classList.add('spinning'));

        setTimeout(() => {
            let results = [];
            reels.forEach((r, idx) => {
                let symbol = this.getRandomSymbol();
                results.push(symbol);
                r.textContent = symbol;
                r.classList.remove('spinning');
            });
            this.calculateWin(results);
        }, 1000); // 1 vteřina točení
    },

    calculateWin: function(results) {
        this.state.isSpinning = false;
        
        // Jednoduchá kontrola výher (počítáme stejné symboly)
        let counts = {};
        for (let s of results) {
            counts[s] = (counts[s] || 0) + 1;
        }

        let winAmount = 0;
        for (let s in counts) {
            if (counts[s] >= 2) {
                let symbolData = SYMBOLS.find(x => x.char === s);
                // Výhra = Hodnota symbolu * počet shod * násobiče
                winAmount += symbolData.value * Math.pow(2, counts[s]-2) * this.state.mult * this.state.patMult;
            }
        }

        if (winAmount > 0) {
            this.state.balance += Math.floor(winAmount);
            // Jackpot animace pokud vyhraje hodně
            if (winAmount > 500) {
                document.body.style.animation = "jackpotPop 0.5s ease-out";
                setTimeout(() => document.body.style.animation = "", 500);
            }
        }

        this.updateUI();

        if (this.state.spins <= 0 && this.state.balance < this.state.debt) {
            setTimeout(() => {
                alert("Došly ti spiny a nemáš na zaplacení dluhu! GAME OVER.");
                location.reload();
            }, 500);
        }
    },

    buyUpgrade: function(type) {
        let cost = this.state.prices[type];
        if (this.state.balance >= cost) {
            this.state.balance -= cost;
            if (type === 'luck' && this.state.luckLv < 6) {
                this.state.luckLv++;
                this.state.prices.luck = Math.floor(this.state.prices.luck * 1.5);
            } else if (type === 'slot' && this.state.slotsCount < 6) {
                this.state.slotsCount++;
                this.state.prices.slot = Math.floor(this.state.prices.slot * 2.5);
                this.renderSlots();
            } else if (type === 'patMult') {
                this.state.patMult++;
                this.state.prices.patMult = Math.floor(this.state.prices.patMult * 1.8);
            }
            this.updateUI();
        }
    },

    payDebt: function() {
        if (this.state.balance >= this.state.debt) {
            this.state.balance -= this.state.debt;
            this.nextShift();
        }
    },

    updateUI: function() {
        document.getElementById('uiLevel').textContent = this.state.level;
        document.getElementById('uiBalance').textContent = Math.floor(this.state.balance).toLocaleString() + " Kč";
        document.getElementById('uiDebt').textContent = Math.floor(this.state.debt).toLocaleString() + " Kč";
        document.getElementById('uiSpins').textContent = this.state.spins;
        document.getElementById('uiMult').textContent = (this.state.mult * this.state.patMult).toFixed(1) + "x";

        document.getElementById('costLuck').textContent = this.state.luckLv >= 6 ? "MAX" : this.state.prices.luck;
        document.getElementById('costSlot').textContent = this.state.slotsCount >= 6 ? "MAX" : this.state.prices.slot;
        document.getElementById('costPatMult').textContent = this.state.prices.patMult;

        document.getElementById('btnLuck').disabled = (this.state.balance < this.state.prices.luck || this.state.luckLv >= 6 || this.state.isSpinning);
        document.getElementById('btnSlot').disabled = (this.state.balance < this.state.prices.slot || this.state.slotsCount >= 6 || this.state.isSpinning);
        document.getElementById('btnPatMult').disabled = (this.state.balance < this.state.prices.patMult || this.state.isSpinning);
        
        document.getElementById('btnSpin').disabled = (this.state.spins <= 0 || this.state.isSpinning || this.state.level === 0);
        document.getElementById('btnPayDebt').disabled = (this.state.balance < this.state.debt || this.state.isSpinning || this.state.level === 0);
    }
};

// Inicializace po načtení
window.onload = () => Game.init();

</script>
</body>
</html>
