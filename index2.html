<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <title>CloverPit: Ultimate Edition (Zouchová Update)</title>
    <style>
        /* [Zde ponech své stávající CSS a přidej toto:] */
        @keyframes reelBlur { 0% { transform: scaleY(1.1) translateY(-4px); filter: blur(3px); } 50% { transform: scaleY(1.1) translateY(4px); filter: blur(4px); } 100% { transform: scaleY(1.1) translateY(-4px); filter: blur(3px); } }
        @keyframes jackpotPop { 0% { transform: translate(-50%, -50%) scale(0); opacity: 0; } 50% { transform: translate(-50%, -50%) scale(1.5); opacity: 1; filter: hue-rotate(90deg); } 100% { transform: translate(-50%, -50%) scale(2.5); opacity: 0; } }
    </style>
</head>
<body>

<div id="quizModal" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.98); z-index:200000; flex-direction:column; align-items:center; justify-content:center; color:white; padding:20px; text-align:center;">
    <img src="Zouchova-Jana.jpg" style="width:200px; height:200px; border-radius:50%; margin-bottom:20px; border: 3px solid #ff2a5f; object-fit: cover;">
    <h2 id="quizQuestion" style="margin-bottom:20px; color: #ff2a5f;">LITERÁRNÍ ZKOUŠKA</h2>
    <div id="quizOptions" style="display:flex; flex-direction:column; gap:10px; width:100%; max-width:400px;"></div>
</div>

<button class="modal-btn" style="border-color: #ff2a5f; color: #ff2a5f; background: rgba(255, 42, 95, 0.1);" onclick="Game.selectDifficulty(5)">
    <span>5. Úroveň: LITERATURA (Boss: Zouchová)</span>
    <span class="btn-desc">Nejtěžší výzva. Extrémní dluhy, každou fázi literární zkouška.</span>
</button>

<script>
// --- ZOUCHOVÁ LOGIKA ---
const ZouchovaQuiz = {
    questions: [
        { q: "Kdo napsal 'Babičku'?", a: ["Božena Němcová", "Karel Čapek", "Jaroslav Seifert"], correct: 0 },
        { q: "Do jakého směru patří 'Máj'?", a: ["Romantismus", "Realismus", "Avantgarda"], correct: 0 },
        { q: "Které dílo napsal Karel Čapek?", a: ["R.U.R.", "Kytice", "Paličova dcera"], correct: 0 }
    ],
    start: function(level) {
        let q = this.questions[Math.floor(Math.random() * this.questions.length)];
        document.getElementById('quizQuestion').textContent = (level === 31 ? "BOSS FIGHT: ZOUCHOVÁ" : "LITERÁRNÍ ZKOUŠKA (Lvl " + level + ")");
        document.getElementById('quizQuestion').innerText += "\n" + q.q;
        
        let container = document.getElementById('quizOptions'); container.innerHTML = '';
        q.a.forEach((opt, idx) => {
            let btn = document.createElement('button');
            btn.className = 'modal-btn'; btn.textContent = opt;
            btn.onclick = () => {
                if (idx === q.correct) { document.getElementById('quizModal').style.display = 'none'; }
                else { alert("Zouchová tě vyhodila! GAME OVER."); location.reload(); }
            };
            container.appendChild(btn);
        });
        document.getElementById('quizModal').style.display = 'flex';
    }
};

// --- ÚPRAVA LOGIKY GENERÁTORU (vlož do ShiftGenerator) ---
const ShiftGenerator = {
    // ... tvoje původní metody ...
    generate: function(diff, idx) {
        if (diff === 5) {
            if (idx >= 31) return null;
            let s = this.getOriginalShift(idx % 30);
            return {
                lvl: idx + 1, debt: Math.floor(s.debt * 4.5), spins: 15, mult: s.mult * 3.5,
                mod: 'debuff_luck', desc: `📖 KAMPANĚ LITERATURA: Zouchová sleduje tvůj pokrok.`
            };
        }
        if (diff === 'endless' && (idx + 1) % 10 === 0) {
            return { lvl: idx + 1, debt: 0, spins: 50, mult: 10, mod: 'power_gold', desc: `🎁 ODMĚNA: ZLATÝ MILNÍK!` };
        }
        // ... zbytek tvého generátoru
    }
};

// --- Integrace do Game.loadShift ---
/* Najdi ve svém kódu funkci 'loadShift' a přidej na začátek:
   if (state.difficulty === 5) { ZouchovaQuiz.start(cur.lvl); }
*/
</script>
</body>
</html>
